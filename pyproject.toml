[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-classification"
version = "0.1.0"
description = "Multi-Class Brain Tumor Detection and Classification in MRI Scans Using Lightweight CNNs and Adaptive Incremental Learning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Harsh Makwana" },
    { name = "Zeel Patel" },
    { name = "Maitri Soni" },
    { name = "Krishna Patel" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
